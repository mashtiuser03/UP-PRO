name: Auto Deploy UP-PRO to Cloudflare

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-Create D1 Database & Inject UUID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # ساخت دیتابیس اگر از قبل وجود نداشته باشد
          npx wrangler@latest d1 create up_pro_master_db || true
          
          # دریافت UUID دیتابیس و قرار دادن خودکار در wrangler.toml
          DB_UUID=$(npx wrangler@latest d1 list --json | node -e "
            const fs = require('fs');
            const list = JSON.parse(fs.readFileSync(0, 'utf-8'));
            const db = list.find(d => d.name === 'up_pro_master_db');
            if (db) console.log(db.uuid);
          ")
          echo "Found D1 UUID: $DB_UUID"
          sed -i "s/REPLACE_WITH_MASTER_D1_UUID/$DB_UUID/g" wrangler.toml

      - name: Deploy UP-PRO Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx wrangler@latest deploy

      - name: Set Bot Secrets (BOT_TOKEN & ADMIN_ID)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.BOT_TOKEN }}" | npx wrangler@latest secret put BOT_TOKEN --name UP-PRO
          echo "${{ secrets.ADMIN_ID }}" | npx wrangler@latest secret put ADMIN_ID --name UP-PRO