<svg viewBox="0 0 680 336" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --lumi-ink: light-dark(#000000, #e0e0e0);
      --lumi-muted: light-dark(#5f6368, #9aa0a6);
      --lumi-dim: light-dark(#f2f0f0, #242528);
      --lumi-container: light-dark(#e8e6e6, #2d2f33);
      --lumi-outline: light-dark(#727676, #9a9b9c);
      --lumi-accent-bg: light-dark(#dcf1ff, #192967);
      --lumi-primary: light-dark(#3186ff, #9dd2ff);
      --lumi-sans: 'Google Sans Flex', var(--font-family, 'Google Sans', sans-serif);
      --lumi-mono: 'Google Sans Code', ui-monospace, monospace;
    }
    text { font-weight: 400; stroke: none; }
    .t-l1 { font-family: var(--lumi-sans); font-size: 15px; fill: var(--lumi-ink); }
    .t-l2 { font-family: var(--lumi-mono); font-size: 13px; font-style: italic; fill: var(--lumi-ink); }
    .t-l4 { font-family: var(--lumi-sans); font-size: 13px; fill: var(--lumi-muted); }
    .node-step { fill: var(--lumi-dim); stroke: none; }
    .node-focal { fill: var(--lumi-accent-bg); stroke: var(--lumi-primary); stroke-width: 1.25; }
    .node-store { fill: var(--lumi-container); stroke: var(--lumi-outline); stroke-width: 1; }
    .edge-seg { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; }
    .edge-arrow { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; marker-end: url(#lumi-caret); }
  </style>
  <defs>
    <marker id="lumi-caret" viewBox="0 0 10 10" refX="7.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--lumi-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect class="node-focal" x="20" y="36" width="172" height="80" rx="40" />
  <text class="t-l1" x="106" y="67" text-anchor="middle" dominant-baseline="central">UP-PRO Master</text>
  <text class="t-l2" x="106" y="89" text-anchor="middle" dominant-baseline="central">master_up_pro.js</text>

  <line class="edge-arrow" x1="200" y1="76" x2="246" y2="76" />

  <rect class="node-store" x="254" y="36" width="172" height="80" rx="40" />
  <text class="t-l1" x="340" y="67" text-anchor="middle" dominant-baseline="central">Master D1 DB</text>
  <text class="t-l2" x="340" y="89" text-anchor="middle" dominant-baseline="central">up_pro_master_db</text>

  <line class="edge-arrow" x1="434" y1="76" x2="480" y2="76" />

  <rect class="node-step" x="488" y="36" width="172" height="80" rx="40" />
  <text class="t-l1" x="574" y="67" text-anchor="middle" dominant-baseline="central">Cloudflare API</text>
  <text class="t-l4" x="574" y="89" text-anchor="middle" dominant-baseline="central">Zero-Touch Deploy</text>

  <line class="edge-seg" x1="574" y1="124" x2="574" y2="150" />
  <rect x="526" y="158" width="96" height="20" rx="10" fill="var(--lumi-dim)" />
  <text class="t-l2" x="574" y="168" text-anchor="middle" dominant-baseline="central">PUT Bundle</text>
  <line class="edge-arrow" x1="574" y1="186" x2="574" y2="212" />

  <rect class="node-focal" x="488" y="220" width="172" height="80" rx="40" />
  <text class="t-l1" x="574" y="251" text-anchor="middle" dominant-baseline="central">UP-PROn Child</text>
  <text class="t-l2" x="574" y="273" text-anchor="middle" dominant-baseline="central">child_up_pron.js</text>

  <line class="edge-arrow" x1="480" y1="260" x2="434" y2="260" />

  <rect class="node-store" x="254" y="220" width="172" height="80" rx="40" />
  <text class="t-l1" x="340" y="251" text-anchor="middle" dominant-baseline="central">Child D1 DB</text>
  <text class="t-l2" x="340" y="273" text-anchor="middle" dominant-baseline="central">up_pro_n_db</text>

  <line class="edge-arrow" x1="246" y1="260" x2="200" y2="260" />

  <rect class="node-step" x="20" y="220" width="172" height="80" rx="40" />
  <text class="t-l1" x="106" y="251" text-anchor="middle" dominant-baseline="central">Workers AI Dual</text>
  <text class="t-l4" x="106" y="273" text-anchor="middle" dominant-baseline="central">Llama 3.1 + Flux</text>
</svg>